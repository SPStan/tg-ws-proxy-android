name: Android
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_release:
        description: Build a release APK with the owner's signing key
        type: boolean
        default: false
      emulator_16k:
        description: Use the Android 17 emulator image with 16 KB pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-linux-android
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Test Rust core
        run: cargo +1.95.0 test --locked
      - name: Build Rust and APK
        run: |
          bash scripts/build-android-native.sh arm64-v8a
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleArm64Debug --no-daemon
      - name: Verify APK signature and 16 KB alignment
        run: |
          apk=app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          bash scripts/verify-android-apk.sh "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-debug
          path: |
            app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
            app/build/outputs/apk/arm64/debug/app-arm64-debug.apk.sha256
          if-no-files-found: error
      - name: Build signed release
        if: inputs.sign_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ||
                -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure all four Android signing secrets before requesting a signed release." >&2
            exit 1
          fi
          export KEYSTORE_FILE=$(mktemp)
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          unset RELEASE_KEYSTORE_BASE64
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleArm64Release --no-daemon --no-configuration-cache
          bash scripts/verify-android-apk.sh app/build/outputs/apk/arm64/release/app-arm64-release.apk
      - uses: actions/upload-artifact@v4
        if: inputs.sign_release
        with:
          name: arm64-release
          path: |
            app/build/outputs/apk/arm64/release/app-arm64-release.apk
            app/build/outputs/apk/arm64/release/app-arm64-release.apk.sha256
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EMULATOR_IMAGE: ${{ inputs.emulator_16k && 'system-images;android-37.1;google_apis_ps16k;x86_64' || 'system-images;android-37.0;default;x86_64' }}
      EMULATOR_PAGE: ${{ inputs.emulator_16k && '16384' || '4096' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Configure the virtual device directory
        run: |
          mkdir -p "$RUNNER_TEMP/proxy-avd"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/proxy-avd" >> "$GITHUB_ENV"
      - name: Install Android 17 image and build x86_64 APK
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 x86_64-linux-android
          sdkmanager 'platforms;android-37.0' 'ndk;28.2.13676358' emulator "$EMULATOR_IMAGE"
          avdmanager create avd --name api37 --package "$EMULATOR_IMAGE" --path "$ANDROID_AVD_HOME/api37.avd" --force <<< no
          ini=$(find "$ANDROID_AVD_HOME" "$HOME/.android" -maxdepth 3 -name api37.ini -print -quit)
          test -n "$ini"
          if [[ "$ini" != "$ANDROID_AVD_HOME/api37.ini" ]]; then
            cp "$ini" "$ANDROID_AVD_HOME/"
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx api37
          bash scripts/build-android-native.sh x86_64
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleEmulatorDebug --no-daemon
      - name: Verify installation, proxy lifecycle and TLS preference
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/emulator/emulator" -avd api37 -port 5554 -cores 4 -memory 4096 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -feature -Vulkan -show-kernel > emulator.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          export ANDROID_SERIAL=emulator-5554
          if ! timeout 240 adb wait-for-device; then
            adb devices -l
            tail -n 100 emulator.log
            exit 1
          fi
          if ! bash scripts/smoke-android.sh app/build/outputs/apk/emulator/debug/app-emulator-debug.apk; then
            adb logcat -d -s ProxyService TgWsProxy AndroidRuntime | tail -n 100 || true
            tail -n 80 emulator.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-log
          path: emulator.log
          if-no-files-found: ignore
